        function escapeHTML(str) {
            if (!str) return '';
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        }

        function renderShops() {
            const filteredShops = shopData.filter(shop => {
                const categoryMatch = currentCategory === 'all' || shop.category.includes(currentCategory);
                const regionMatch = currentRegion === 'all' || shop.region.includes(currentRegion);
                const searchMatch = shop.name.toLowerCase().includes(currentSearch.toLowerCase());
                return categoryMatch && regionMatch && searchMatch;
            });
